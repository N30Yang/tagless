<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tagless: build a website without any HTML tags</title>
    <style>
        :root {
            --paper: #fefcfd;
            --warm: #f5f2f5;
            --ink: #1a1729;
            --soft: #4a455c;
            --smoke: #8a839a;
            --magenta: #ff2d6f;
            --magenta-deep: #c9134d;
            --magenta-soft: #ffc8d8;
            --blue: #1e54ff;
            --purple: #5a2dc9;
            --green: #2cc294;
            --highlight: #ffd3e0;
            --fd: "Phantom Sans", Helvetica, sans-serif;
            --fb: "Hanken Grotesk", -apple-system, BlinkMacsystemFont, "Segoe UI", sans-serif;
            --fm: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-400.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-500.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-700.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-800.woff2") format("woff2");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "JetBrains Mono";
            src: url(https://tagless.hackclub.com/fonts/jetbrains-mono-400.woff2) format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--fb);
            font-size: 17px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .max {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hdr {
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1.5px solid var(--ink);
            background: rgba(254, 252, 253, 0.9);
        }

        .hdr-in {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 56px;
            padding: 8px 24px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .logo-img {
            height: 34px;
            width: auto;
            cursor: pointer;
            display: block;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            font-weight: 500;
        }

        .nlink {
            cursor: pointer;
            color: var(--soft);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            background: var(--magenta);
            color: #fff;
            box-shadow: 4px 4px 0 var(--ink);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            white-space: nowrap;
        }

        .pill:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .pill:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .pill.ghost {
            background: transparent;
            color: var(--ink);
        }

        .pill.big {
            padding: 11px 18px;
            font-size: 15px;
        }

        .hero {
            display: flex;
            gap: 56px;
            align-items: flex-start;
            padding: 56px 24px 64px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-l {
            flex: 1;
            min-width: 0;
            padding: 8px 0 24px;
        }

        .h1 {
            font-family: var(--fd);
            font-weight: 400;
            letter-spacing: -0.025em;
            line-height: 0.9;
            margin: 0 0 32px;
            font-size: clamp(50px, 6.5vw, 100px);
        }

        .h1 .pink {
            color: var(--magenta);
            font-style: normal;
        }

        .lede {
            font-size: 18px;
            line-height: 1.55;
            color: var(--soft);
            max-width: 500px;
            margin: 0 0 32px;
        }

        .hl {
            background: var(--highlight);
            color: var(--ink);
            font-weight: 600;
            padding: 0 3px;
            border-radius: 2px;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
            ;
        }

        .prize-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: inherit;
        }

        .tag-mockup {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .prize-cap {
            font-family: var(--fm);
            font-size: 10px;
            color: var(--soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .spon {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 520px;
            padding-top: 8px;
        }

        .spon-line {
            flex: 1;
            border-top: 1.5px solid rgba(26, 23, 41, 0.15);
        }

        .spon-t {
            font-family: var(--fm);
            font-size: 10px;
            color: rgba(77, 72, 101, 0.6);
            white-space: nowrap;
        }

        .meta4 {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 32px;
            padding-top: 20px;
            max-width: 520px;
        }

        .meta-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-k {
            font-family: var(--fm);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--smoke);
        }

        .meta-v {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.2;
        }

        .meta-v.u {
            text-decoration: underline;
            cursor: pointer;
        }

        .hero-r {
            display: flex;
            gap: 12px;
            width: 356px;
            flex-shrink: 0;
            align-items: flex-start;
        }

        .pcol {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .pcol.down {
            padding-top: 40px;
        }

        .ph {
            width: 100%;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            background: var(--warm);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .ph:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 6px 6px 0 var(--ink);
            position: relative;
            z-index: 5;
        }

        .mstrip {
            display: none;
            gap: 12px;
            overflow-x: auto;
            padding: 0 24px 8px;
            margin: 0 -24px;
        }

        .mq-zone {
            position: relative;
        }

        .mq {
            position: relative;
            z-index: 10;
            width: 104%;
            margin-left: -2%;
            transform: rotate(-1.2deg);
            background: var(--ink);
            border-top: 1.5px solid var(--ink);
            border-bottom: 1.5px solid var(--ink);
            overflow: hidden;
            white-space: nowrap;
        }

        .mq-track {
            display: inline-flex;
            width: max-content;
            gap: 24px;
            padding: 10px 0;
            font-family: var(--fm);
            font-size: 13px;
            color: rgba(250, 243, 230, 0.85);
            animation: slide 36s linear infinite;
        }

        @keyframes slide {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .struck {
            text-decoration: line-through;
            text-decoration-color: var(--magenta);
            text-decoration-thickness: 2.5px;
        }

        .exx {
            color: var(--magenta);
        }

        .steps {
            background: var(--warm);
            padding: 80px 0;
            margin-top: -20px;
        }

        .h2 {
            font-family: var(--fd);
            font-weight: 400;
            margin: 0 0 48px;
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1;
        }

        .grid-steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 64px;
        }

        .step {
            border-top: 1.5px solid rgba(26, 23, 41, 0.14);
            padding: 20px 0 32px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .bign {
            font-family: var(--fd);
            line-height: 0.8;
            font-size: clamp(56px, 6vw, 84px);
        }

        .step-h {
            font-weight: 800;
            font-size: 19px;
            margin: 0 0 8px;
        }

        .step-p {
            color: var(--soft);
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            max-width: 42ch;
        }

        .wave-wrap {
            line-height: 0;
        }

        .wave-wrap.warm {
            background: var(--warm);
        }

        .wave-wrap.paper {
            background: var(--paper);
        }

        .wave-img {
            display: block;
            width: 100%;
            height: auto;
        }

        .wave-img.flip {
            transform: scaleY(-1);
        }

        .dark {
            background: var(--ink);
            color: var(--paper);
            padding: 80px 0 72px;
        }

        .dark .kicker {
            font-family: var(--fm);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .res-card {
            border: 1px solid rgba(250, 243, 230, 0.2);
            border-radius: 16px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: transform 0.22s ease, background 0.22s ease;
        }

        .res-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
        }

        .res-t {
            font-weight: 800;
            font-size: 18px;
            margin: 0 0 8px;
        }

        .res-d {
            opacity: 0.75;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 12px;
        }

        .res-go {
            font-weight: 700;
            font-size: 13px;
            color: var(--highlight);
        }

        .faq-sect {
            padding: 72px 0 20px;
        }

        .faq-item {
            border: 1.5px solid var(--ink);
            border-radius: 14px;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 4px 4px 0 var(--ink);
            overflow: hidden;
        }

        .faq-q {
            padding: 16px 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .faq-a {
            padding: 0 18px;
            line-height: 1.6;
            color: var(--soft);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, padding 0.25s ease;
            font-size: 15px;
        }

        .faq-item.open .faq-a {
            padding: 0 18px 19px;
            max-height: 320px;
        }

        .plus {
            background: var(--ink);
            color: var(--paper);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            line-height: 24px;
            text-align: center;
            flex: 0 0 auto;
            font-size: 14px;
        }

        .foot {
            background: var(--ink);
            color: var(--paper);
            margin-top: 56px;
            padding: 40px 0 32px;
        }

        .foot-grid {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .foot-b {
            font-weight: 400;
            font-size: 24px;
            font-family: var(--fd);
        }

        .foot-s {
            opacity: 0.75;
            line-height: 2;
            font-size: 14px;
        }

        .foot-h {
            font-family: var(--fm);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 6px;
        }

        .foot-link {
            cursor: pointer;
        }

        .pill,
        .nlink,
        .res-card,
        .prize-btn,
        .meta-v.u,
        .flink {
            text-decoration: none;
            color: inherit;
        }

        .flink:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 28px;
            opacity: 0.55;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width:1020px) {
            .hero {
                flex-direction: column;
                gap: 8px;
            }

            .hero-r {
                display: none;
            }

            .mstrip {
                display: flex;
            }

            .grid-steps {
                grid-template-columns: 1fr;
            }

            .res-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>
    <script>
        (function () {
            var LT = String.fromCharCode(60);
            var GT = String.fromCharCode(62);
            var BASE = "https://tagless.hackclub.com";
            function mk(tag, cls, txt) {
                var e = document.createElement(tag);
                if (cls) { e.className = cls; }
                if (txt !== undefined && txt !== null) { e.textContent = txt; }
                return e;
            }

            function img(src, cls, alt) {
                var e = document.createElement("img");
                e.className = cls;
                e.src = src;
                if (alt) { e.alt = alt; }
                return e;
            }

            function lnk(cls, txt, href, ext) {
                var e = document.createElement("a");
                if (cls) { e.className = cls; }
                if (txt !== undefined && txt !== null) { e.textContent = txt; }
                e.href = href;
                if (ext) { e.target = "_blank"; e.rel = "noopener noreferrer"; }
                return e;
            }

            function go(id) {
                var t = document.getElementById(id);
                if (t) { t.scrollIntoView({ behavior: "smooth" }); }
            }

            var hdr = mk("div", "hdr");
            var hin = mk("div", "hdr-in");
            var logoA = lnk(null, null, BASE + "/");
            logoA.appendChild(img(BASE + "/tagless-full.png", "logo-img", "tagless"));
            var nav = mk("div", "nav");
            var nl = mk("div", "nav nav-links");
            nl.appendChild(lnk("nlink", "docs", BASE + "/docs"));
            nl.appendChild(lnk("nlink", "shop", BASE + "/shop"));
            nl.appendChild(lnk("nlink", "gallery", BASE + "/gallery"));
            var ship = lnk("pill", "ship it", BASE + "/submit");
            ship.appendChild(mk("span", null, " →"));
            nav.appendChild(nl);
            nav.appendChild(ship);
            hin.appendChild(logoA);
            hin.appendChild(nav);
            hdr.appendChild(hin);
            document.body.appendChild(hdr);

            var hero = mk("div", "hero");
            hero.id = "top";
            var left = mk("div", "hero-l");
            var h1 = mk("div", "h1");
            h1.appendChild(mk("span", null, "build a website. "));
            var brk = document.createElement("br");
            h1.appendChild(brk);
            h1.appendChild(mk("span", "pink", "no html tags."));
            var lede = mk("div", "lede");
            lede.appendChild(mk("span", null, "Ship a website without a single HTML tag: not in raw HTML, not in JSX, not anywhere. Spend "));
            lede.appendChild(mk("span", "hl", "4 hours"));
            lede.appendChild(mk("span", null, " on your project and "));
            lede.appendChild(mk("span", "hl", "claim your luggage tag"));
            lede.appendChild(mk("span", null, "! Every extra hour past that earns shop stamps too!"));
            var ctas = mk("div", "cta-row");
            var c1 = lnk("pill big", "ship it", BASE + "/submit");
            c1.appendChild(mk("span", null, " →"));
            var c2 = lnk("pill big ghost", "read the resources", BASE + "/docs");
            ctas.appendChild(c1);
            ctas.appendChild(c2);
            var pb = lnk("prize-btn", null, BASE + "/submit");
            pb.appendChild(img(BASE + "/assets/tag-mockup.webp", "tag-mockup", "Hack Club Tagless luggage tag"));
            pb.appendChild(mk("span", "prize-cap", " ← your prize"));
            var spon = mk("div", "spon");
            spon.appendChild(mk("div", "spon-line"));
            spon.appendChild(mk("div", "spon-t", "sponsored by Jared"));
            var meta = mk("div", "meta4");
            var mdata = [
                ["prize", "custom hack club luggage tag :)"],
                ["workshop", "clubs.hackclub.com", "https://clubs.hackclub.com"],
                ["extra hours", "spend stamps on the shop"],
                ["required hours", "4 hours (minimum)"]
            ];
            for (var mi = 0; mi < mdata.length; mi = mi + 1) {
                (function (q) {
                    var cell = mk("div", "meta-cell");
                    cell.appendChild(mk("div", "meta-k", mdata[q][0]));
                    if (mdata[q][2]) { cell.appendChild(lnk("meta-v u", mdata[q][1], mdata[q][2], true)); }
                    else { cell.appendChild(mk("div", "meta-v", mdata[q][1])); }
                    meta.appendChild(cell);
                })(mi);
            }
            left.appendChild(h1);
            left.appendChild(lede);
            left.appendChild(ctas);
            left.appendChild(pb);
            left.appendChild(spon);
            left.appendChild(meta);

            var right = mk("div", "hero-r");
            var colA = mk("div", "pcol down");
            var colB = mk("div", "pcol");
            var phs = ["hero_photo1.webp", "hero_photo3.webp", "hero_photo5.webp", "hero_photo2.webp", "hero_photo4.webp", "hero_photo6.webp"];
            var rots = ["-1.8deg", "2deg", "-1.5deg", "2.2deg", "-2deg", "1.8deg"];
            var heights = ["112px", "112px", "112px", "118px", "118px", "118px"];

            for (var pi = 0; pi < 3; pi = pi + 1) {
                (function (n) {
                    var e = img(BASE + "/assets/" + phs[n], "ph", "");
                    e.style.transform = "rotate(" + rots[n] + ")";
                    e.style.height = heights[n];
                    colA.appendChild(e);
                })(pi);
            }
            for (var pj = 3; pj < 6; pj = pj + 1) {
                (function (n) {
                    var e = img(BASE + "/assets/" + phs[n], "ph", "");
                    e.style.transform = "rotate(" + rots[n] + ")";
                    e.style.height = heights[n];
                    colB.appendChild(e);
                })(pj);
            }
            right.appendChild(colA);
            right.appendChild(colB);
            hero.appendChild(left);
            hero.appendChild(right);
            document.body.appendChild(hero);

            var ms = mk("div", "max mstrip");
            ms.id = "photos";
            for (var msi = 0; msi < phs.length; msi = msi + 1) {
                (function (n) {
                    var e = img(BASE + "/assets/" + phs[n], "ph", "");
                    e.style.height = "125px";
                    e.style.width = "auto";
                    e.style.flexShrink = "0";
                    ms.appendChild(e);
                })(msi);
            }
            document.body.appendChild(ms);

            var zone = mk("div", "mq-zone");
            var mq = mk("div", "mq");
            var track = mk("div", "mq-track");
            var names = ["div", "span", "h1", "p", "img", "button", "a", "section", "ul", "table", "form", "nav", "footer", "main", "article", "input",];
            function half() {
                var h = mk("div", null);
                h.style.display = "inline-flex";
                h.style.gap = "24px";
                h.style.flexShrink = "0";
                for (var k = 0; k < names.length; k = k + 1) {
                    (function (n) {
                        var wrap = mk("span", null);
                        wrap.style.display = "inline-flex";
                        wrap.style.alignItems = "center";
                        wrap.style.gap = "24px";
                        wrap.style.flexShrink = "0";
                        wrap.appendChild(mk("span", "struck", LT + names[n] + GT));
                        wrap.appendChild(mk("span", "exx", "x"));
                        h.appendChild(wrap);
                    })(k);
                }
                return h;
            }
            track.appendChild(half());
            track.appendChild(half());
            mq.appendChild(track);
            zone.appendChild(mq);
            document.body.appendChild(zone);

            var steps = mk("div", "steps");
            steps.id = "steps";
            var sin = mk("div", "max");
            sin.appendChild(mk("div", "h2", "four steps. "));
            var gs = mk("div", "grid-steps");
            var sdata = [
                ["1", "track your time", "Set up Hackatime (free, open source WakaTime). Create a project and log your hours. Minimum 4 hours to qualify.", "#1e54ff"],
                ["2", "build a website", "Use any language or framework: Python, Rust, raw JS, whatever. The only rule: zero HTML tags anywhere in your code.", "#ff2d6f"],
                ["3", "ship it", "After you complete 4 hours, deploy your site somewhere public. Then fill out the submission form!", "#5a2dc9"],
                ["4", "get a tag", "After you ship your project, you will get reviewed. Once approved, you will get a slack message from our bot to claim your luggage tag. Spend more than 4 hours? Earn stamps to use in the shop!", "#2cc294"]
            ];
            for (var si = 0; si < sdata.length; si = si + 1) {
                (function (j) {
                    var s = mk("div", "step");
                    var n = mk("div", "bign", sdata[j][0]);
