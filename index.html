<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tagless: build a website without any HTML tags</title>
    <style>
        :root {
            --paper: #fefcfd;
            --warm: #f5f2f5;
            --ink: #1a1729;
            --soft: #4a455c;
            --smoke: #8a839a;
            --magenta: #ff2d6f;
            --magenta-deep: #c9134d;
            --magenta-soft: #ffc8d8;
            --blue: #1e54ff;
            --purple: #5a2dc9;
            --green: #2cc294;
            --highlight: #ffd3e0;
            --fd: "Phantom Sans", Helvetica, sans-serif;
            --fb: "Hanken Grotesk", -apple-system, BlinkMacsystemFont, "Segoe UI", sans-serif;
            --fm: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-400.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-500.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-700.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-800.woff2") format("woff2");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "JetBrains Mono";
            src: url(https://tagless.hackclub.com/fonts/jetbrains-mono-400.woff2) format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--fb);
            font-size: 17px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .max {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hdr {
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1.5px solid var(--ink);
            background: rgba(254, 252, 253, 0.9);
        }

        .hdr-in {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 56px;
            padding: 8px 24px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .logo-img {
            height: 34px;
            width: auto;
            cursor: pointer;
            display: block;
        }
    </style>
</head>

</html>
