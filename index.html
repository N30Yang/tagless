<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tagless: build a website without any HTML tags</title>
    <style>
        :root {
            --paper: #fefcfd;
            --warm: #f5f2f5;
            --ink: #1a1729;
            --soft: #4a455c;
            --smoke: #8a839a;
            --magenta: #ff2d6f;
            --magenta-deep: #c9134d;
            --magenta-soft: #ffc8d8;
            --blue: #1e54ff;
            --purple: #5a2dc9;
            --green: #2cc294;
            --highlight: #ffd3e0;
            --fd: "Phantom Sans", Helvetica, sans-serif;
            --fb: "Hanken Grotesk", -apple-system, BlinkMacsystemFont, "Segoe UI", sans-serif;
            --fm: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Phantom Sans";
            src: url("https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-400.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-500.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-700.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("https://tagless.hackclub.com/fonts/hanken-grotesk-800.woff2") format("woff2");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "JetBrains Mono";
            src: url(https://tagless.hackclub.com/fonts/jetbrains-mono-400.woff2) format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--fb);
            font-size: 17px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .max {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hdr {
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1.5px solid var(--ink);
            background: rgba(254, 252, 253, 0.9);
        }

        .hdr-in {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 56px;
            padding: 8px 24px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .logo-img {
            height: 34px;
            width: auto;
            cursor: pointer;
            display: block;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            font-weight: 500;
        }

        .nlink {
            cursor: pointer;
            color: var(--soft);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            background: var(--magenta);
            color: #fff;
            box-shadow: 4px 4px 0 var(--ink);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            white-space: nowrap;
        }

        .pill:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .pill:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .pill.ghost {
            background: transparent;
            color: var(--ink);
        }

        .pill.big {
            padding: 11px 18px;
            font-size: 15px;
        }

        .hero {
            display: flex;
            gap: 56px;
            align-items: flex-start;
            padding: 56px 24px 64px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-l {
            flex: 1;
            min-width: 0;
            padding: 8px 0 24px;
        }

        .h1 {
            font-family: var(--fd);
            font-weight: 400;
            letter-spacing: -0.025em;
            line-height: 0.9;
            margin: 0 0 32px;
            font-size: clamp(50px, 6.5vw, 100px);
        }

        .h1 .pink {
            color: var(--magenta);
            font-style: normal;
        }

        .lede {
            font-size: 18px;
            line-height: 1.55;
            color: var(--soft);
            max-width: 500px;
            margin: 0 0 32px;
        }

        .h1 {
            background: var(--highlight);
            color: var(--ink);
            font-weight: 600;
            padding: 0 3px;
            border-radius: 2px;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
            ;
        }

        .prize-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: inherit;
        }

        .tag-mockup {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .prize-cap {
            font-family: var(--fm);
            font-size: 10px;
            color: var(--soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .spon {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 520px;
            padding-top: 8px;
        }

        .spon-line {
            flex: 1;
            border-top: 1.5px solid rgba(26, 23, 41, 0.15);
        }

        .spon-t {
            font-family: var(--fm);
            font-size: 10px;
            color: rgba(77, 72, 101, 0.6);
            white-space: nowrap;
        }

        .meta4 {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 32px;
            padding-top: 20px;
            max-width: 520px;
        }

        .meta-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-k {
            font-family: var(--fm);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--smoke);
        }

        .meta-v {
            font-family: 700;
            font-size: 15px;
            line-height: 1.2;
        }

        .meta-v.u {
            text-decoration: underline;
            cursor: pointer;
        }

        .hero-r {
            display: flex;
            gap: 12px;
            width: 356px;
            flex-shrink: 0;
            align-items: flex-start;
        }

        .pcol {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .pcol.down {
            padding-top: 40px;
        }

        .ph {
            width: 100%;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            transition: transform 0.3s ease, box-shdow 0.3s ease;
        }

        .ph:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 6px 6px 0 var(--ink);
            position: relative;
            z-index: 5;
        }

        .mstrip {
            display: none;
            gap: 12px;
            overflow-x: auto;
            padding: 0 24px 8px;
            margin: 0 -24px;
        }

        .mq-zone {
            position: relative;
        }

        .mq {
            position: relative;
            z-index: 10;
            width: 104%;
            margin-left: -2%;
            transform: rotate(-1.2deg);
            background: var(--ink);
            border-top: 1.5px solid var(--ink);
            border-bottom: 1.5px solid var(--ink);
            overflow: hidden;
            white-space: nowrap;
        }

        .mq-track {
            display: inline-flex;
            width: max-content;
            gap: 24px;
            padding: 10px 0;
            font-family: var(--fm);
            font-size: 13px;
            color: rgba(250, 243, 230, 0.85);
            animation: slide 36s linear infinite;
        }

        @keyframes slide {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .struck {
            text-decoration: line-through;
            text-decoration-color: var(--magenta);
            text-decoration-thickness: 2.5px;
        }

        .exx {
            color: var(--magenta);
        }

        .steps {
            background: var(--warm);
            padding: 80px 0;
            margin-top: -20px;
        }

        .h2 {
            font-family: var(--fd);
            font-weight: 400;
            margin: 0 0 48px;
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1;
        }

        .grid-steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 64px;
        }

        .step {
            border-top: 1.5px solid rgba(26, 23, 41, 0.14);
            padding: 20px 0 32px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .bign {
            font-family: var(--fd);
            line-height: 0.8;
            font-size: clamp(56px, 6vw, 84px);
        }

        .step-h {
            font-weight: 800;
            font-size: 19px;
            margin: 0 0 8px;
        }

        .step-p {
            color: var(--soft);
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            max-width: 42ch;
        }

        .wave-wrap {
            line-height: 0;
        }

        .wave-wrap.warm {
            background: var(--warm);
        }

        .wave-wrap.paper {
            background: var(--paper);
        }

        .wave-img {
            display: block;
            width: 100%;
            height: auto;
        }

        .wave-img.flip {
            transform: scaleY(-1);
        }

        .dark {
            background: var(--ink);
            color: var(--paper);
            padding: 80px 0 72px;
        }

        .dark .kicker {
            font-family: var(--fm);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .res-card {
            border: 1px solid rgba(250, 243, 230, 0.2);
            border-radius: 16px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: transform 0.22s ease, background 0.22s ease;
        }

        .res-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
        }

        .res-t {
            font-weight: 800;
            font-size: 18px;
            margin: 0 0 8px;
        }

        .res-d {
            opacity: 0.75;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 12px;
        }

        .res-go {
            font-weight: 700;
            font-size: 13px;
            color: var(--highlight);
        }

        .faq-sect {
            padding: 72px 0 20px;
        }

        .faq-item {
            border: 1.5px solid var(--ink);
            border-radius: 14px;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 4px 4px 0 var(--ink);
            overflow: hidden;
        }

        .faq-q {
            padding: 16px 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .faq-a {
            padding: 0 18px;
            line-height: 1.6;
            color: var(--soft);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, padding 0.25s ease;
            font-size: 15px;
        }

        .faq-item.open .faq-a {
            padding: 0 18px 19px;
            max-height: 320px;
        }

        .plus {
            background: var(--ink);
            color: var(--paper);
            border-radius: 505;
            width: 26px;
            height: 26px;
            line-height: 24px;
            text-align: center;
            flex: 0 0 auto;
            font-size: 14px;
        }

        .foot {
            background: var(--ink);
            color: var(--paper);
            margin-top: 56px;
            padding: 40px 0 32px;
        }

        .foot-grid {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .foot-b {
            font-weight: 400;
            font-size: 24px;
            font-family: var(--fd);
        }

        .foot-s {
            opacity: 0.75;
            line-height: 2;
            font-size: 14px;
        }

        .foot-h {
            font-family: var(--fm);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 6px;
        }

        .foot-link {
            cursor: pointer;
        }

        .pill,
        .nlink,
        .res-card,
        .prize-btn,
        .meta-v.u,
        .flink {
            text-decoration: none;
            color: inherit;
        }

        .flink:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 28px;
            opacity: 0.55;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width:1020px) {
            .hero {
                flex-direction: column;
                gap: 8px;
            }

            .hero-r {
                display: none;
            }

            .mstrip {
                display: flex;
            }

            .grid-steps {
                grid-template-columns: 1fr;
            }

            .res-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>
    <scirpt>

    </scirpt>
</body>

</html>
